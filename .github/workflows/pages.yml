# Pubblicazione del sito su GitHub Pages.
# Il sito e' HTML statico: non c'e' niente da compilare, si carica la
# cartella cosi' com'e'. Si usa questo workflow al posto della build
# "legacy" di Pages perche' quella falliva senza dare un messaggio d'errore.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
